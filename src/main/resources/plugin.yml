name: Tools
version: '1.0.0-SNAPSHOT'
main: pl.lokos.tools.basic.ToolsPlugin
api-version: '26.3'
description: Modulare narzedzia serwera z asynchronicznym MySQL
author: LokosPL
website: https://github.com/LokosPL/Tools
commands:
  tools:
    description: Informacje, status i statystyki
    usage: /tools [help|status|ping|stats <nick>]
    permission: tools.admin
permissions:
  tools.admin:
    description: Dostep do komend administracyjnych Tools
    default: op
